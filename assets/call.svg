<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Call</title>
  <!-- The dialer's own Call glyph, for the tray menu's recent-numbers
       section. Electron hands the desktop a bitmap, so this cannot follow the
       system menu's light or dark theme the way the app's own icons follow the
       ok token; the green here sits between that token's two values (34D399
       dark, 0FA36B light) so it stays legible on either menu background.
       Re-render both PNGs with tools/render-call-icon.sh -->
  <path fill="#17A673" d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.7a2 2 0 0 1 1.7 2z"/>
</svg>
